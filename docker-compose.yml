# Arquitectura de 3 contenedores: proxy (Nginx) -> app (Flask) -> db (PostgreSQL)
services:

  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    ports:
      - "80:80"                      # ÚNICO puerto expuesto al exterior
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - red_interna
    restart: unless-stopped

  app:
    image: ${DOCKERHUB_USER}/cloud-login-app:1.1.0
    build:
      context: .
      dockerfile: app/Dockerfile
      platforms:
        - linux/amd64
    container_name: app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      RUN_DB_INIT: "false"           # en local lo hace el script de initdb de Postgres
    expose:
      - "8000"                       # solo visible dentro de la red interna
    depends_on:
      db:
        condition: service_healthy   # espera a que la BD esté lista
    networks:
      - red_interna
    restart: unless-stopped

  db:
    image: postgres:17.2-alpine      # imagen oficial, versión fija (no "latest")
    container_name: db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data          # persistencia
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Sin "ports": la BD NO es accesible desde fuera de la red interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - red_interna
    restart: unless-stopped

networks:
  red_interna:
    driver: bridge

volumes:
  db_data:
