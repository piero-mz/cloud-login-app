{# Iconos SVG en línea (trazo con currentColor) #}
{% macro icono(nombre, tam=18) -%}
<svg class="icono" width="{{ tam }}" height="{{ tam }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if nombre == 'resumen' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  {%- elif nombre == 'servicios' %}<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>
  {%- elif nombre == 'trafico' %}<path d="M3 12h4l3-8 4 16 3-8h4"/>
  {%- elif nombre == 'usuarios' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>
  {%- elif nombre == 'actividad' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif nombre == 'ok' %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
  {%- elif nombre == 'aviso' %}<path d="M12 3.5l9 16H3z"/><path d="M12 10v4M12 17h.01"/>
  {%- elif nombre == 'salir' %}<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/>
  {%- endif %}
</svg>
{%- endmacro %}

{% macro marca(tam=28) -%}
<svg class="marca-logo" width="{{ tam }}" height="{{ tam }}" viewBox="0 0 28 28" aria-hidden="true">
  <rect width="28" height="28" rx="7" fill="#3A5BD9"/>
  <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
    <path d="M5.5 19.5a8.5 8.5 0 0 1 17 0"/>
    <path d="M9.5 19.5a4.5 4.5 0 0 1 9 0"/>
    <path d="M13 19.5a1 1 0 0 1 2 0"/>
  </g>
</svg>
{%- endmacro %}
